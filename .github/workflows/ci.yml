name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-
      # Self-contained (no EventHub.* consumption): the contract snapshot net guards the wire surface.
      - name: Build + snapshot tests
        run: dotnet test Contracts.slnx --configuration Release --logger "console;verbosity=normal"

  publish:
    needs: build-test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Pack
        run: |
          dotnet pack src/EventHub.Contracts/EventHub.Contracts.csproj -c Release -o ./artifacts
          dotnet pack src/EventHub.Contracts.Grpc/EventHub.Contracts.Grpc.csproj -c Release -o ./artifacts
      - name: Push to feed
        run: >-
          dotnet nuget push "./artifacts/*.nupkg"
          --source "${{ vars.EVENTHUB_NUGET_FEED || 'https://nuget.pkg.github.com/tatotopuria/index.json' }}"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
